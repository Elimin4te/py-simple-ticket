<div class="form-group row">
    <label class="col-sm-3 control-label text-sm-right pt-2">Actividad <span class="required"> *</span></label>
    <div class="col-sm-6">
        <input type="text" name="AF_actividad" class="form-control" placeholder="Nombre de la actividad a realizar."
            required="" {% if edit_mode %} value="{{ obj.AF_actividad }}" {% endif %}>
    </div>
</div>

<div class="form-group row">
    <label class="col-lg-3 control-label text-lg-right pt-2">Descripción <span class="required"> *</span></label>
    <div class="col-lg-6">
        <textarea class="summernote" name="AF_descripcion" data-plugin-summernote required
            data-plugin-options='{ "height": 180, "codemirror": { "theme": "ambiance" } }'>
            {% if edit_mode %}{{ obj.AF_descripcion }}{% endif %}
        </textarea>
    </div>
</div>

<div class="form-group row">
    {% if not edit_mode %}

    <label class="col-lg-3 control-label text-lg-right pt-2">Ticket Asociado <span class="required"> *</span></label>
    {% if incoming_ticket %}
    <div class="col-sm-6">
        <input type="text" class="form-control" readonly
            value="#{{ incoming_ticket.NU_ticket }} - {{ incoming_ticket.AF_titulo }}">
        <input type="hidden" name="NU_ticket" value="{{ incoming_ticket.NU_ticket }}">
    </div>


    {% else %}
    <div class="col-lg-6">
        <select data-plugin-selectTwo class="form-control populate" name="NU_ticket"
            data-plugin-options='{ "placeholder": "Seleccione un Ticket", "allowClear": true }'>
            <option value=""></option>
            {% for ticket in tickets %}
            <option value="{{ ticket.NU_ticket }}">
                {{ ticket.NU_ticket }} - {{ ticket.AF_titulo }}
            </option>
            {% endfor %}
        </select>
    </div>

    {% endif %}

    {% else %}
    <label class="col-lg-3 control-label text-lg-right pt-2"># Ticket</label>
    <div class="col-sm-2" style="cursor: pointer;">
        <a href="/tickets/detail?_={{ obj.NU_ticket }}">
            <input type="text" class="form-control" readonly value="#{{ obj.NU_ticket }} - {{ obj.ticket.AF_titulo }}">
            <input type="hidden" name="NU_ticket" class="form-control" readonly value="{{ obj.NU_ticket }}">
        </a>
    </div>
    <label class="col-lg-1 control-label text-lg-right pt-2"># Correlativo</label>
    <div class="col-sm-1">
        <input type="text" class="form-control" readonly value="#{{ obj.NU_correlativo }}">
    </div>
    <label class="col-lg-1 control-label text-lg-right pt-2">¿Anulada?</label>
    <div class="col-lg-1">
        <div class="switch switch-sm switch-primary">
            <input type="checkbox" name="BO_anulada" data-plugin-ios-switch="" {% if obj.BO_anulada %}checked="checked"
                {% endif %} style="display: none;">
        </div>
    </div>
    {% endif %}
</div>

<div class="form-group row">
    <label class="col-lg-3 control-label text-lg-right pt-2">Fecha de Actividad <span class="required"> *</span></label>
    <div class="col-lg-6">
        <div class="input-group">
            <span class="input-group-prepend">
                <span class="input-group-text">
                    <i class="fas fa-calendar-alt"></i>
                </span>
            </span>
            <input placeholder="____/__/__" class="form-control" name="TI_fecha_actividad" {% if edit_mode %}
                value="{{ obj.TI_fecha_actividad }}" data-plugin-masked-input data-input-mask="9999/99/99" {% else
                %}type="text" data-plugin-datepicker="" data-plugin-skin="primary" data-date-format="yyyy/mm/dd" {%
                endif %}>
        </div>
    </div>
</div>

<div class="form-group row"
    style="border-bottom: 1px solid #eff2f7 !important; padding-bottom: 15px !important; margin-bottom: 15px !important;">
    <label class="col-lg-3 control-label text-lg-right pt-2">Analista Realizador <span class="required">
            *</span></label>
    <div class="col-lg-6">
        <select data-plugin-selectTwo class="form-control populate" name="AF_usuario_realizador"
            data-plugin-options='{ "placeholder": "Asigne un Analista", "allowClear": true }' id="analist-select">
            <option value=""></option>
            {% for analist in analists %}
            <option value="{{ analist.AF_alias }}">
                {{ analist.AF_nombre }} {{ analist.AF_apellido }}
            </option>
            {% endfor %}
        </select>
    </div>
</div>

{% if incoming_ticket %}
<script>
    $(document).ready(function () {
        // Set defaults
        $('#analist-select').val('{{ incoming_ticket.AF_analista_asignado }}').trigger('change');
    });
</script>
{% endif %}

{% if edit_mode %}
<script>
    $(document).ready(function () {
        // Set defaults
        $('#analist-select').val('{{ obj.AF_usuario_realizador }}').trigger('change');
    });
</script>
{% endif %}
