{% if edit_mode %}
<div class="form-group row">
    <label class="col-sm-3 control-label text-sm-right pt-2"># Ticket</label>
    <div class="col-sm-3">
        <input type="text" name="NU_ticket" class="form-control" readonly value="{{ ticket.NU_ticket }}">
    </div>
</div>
{% endif %}

<div class="form-group row">
    <label class="col-sm-3 control-label text-sm-right pt-2">Título <span class="required"> *</span></label>
    <div class="col-sm-6">
        <input type="text" name="AF_titulo" class="form-control" placeholder="Título" required="" 
        {% if edit_mode %}value="{{ ticket.AF_titulo }}" {% endif %}>
    </div>
</div>

<div class="form-group row">
    <label class="col-lg-3 control-label text-lg-right pt-2">Descripción <span class="required"> *</span></label>
    <div class="col-lg-6">
        <textarea class="summernote" name="AF_descripcion" data-plugin-summernote
            data-plugin-options='{ "height": 180, "codemirror": { "theme": "ambiance" } }'>
            {% if edit_mode %}{{ ticket.AF_descripcion }}{% else %}<p>Descripción del Ticket</p>{% endif %}
        </textarea>
    </div>
</div>

{% if edit_mode %}
<div class="form-group row">
    <label class="col-lg-3 control-label text-lg-right pt-2">Estatus</label>
    <div class="col-lg-6">
        <select class="form-control" name="AF_estatus">
            <option value="Nuevo" selected="">Nuevo</option>
            <option value="Asignado">Asignado</option>
            <option value="En Curso">En Curso</option>
            <option value="Resuelto">Resuelto</option>
            <option value="Cerrado">Cerrado</option>
        </select>
    </div>
</div>
{% endif %}

<div class="form-group row">
    <label class="col-lg-3 control-label text-lg-right pt-2">Incidencia Asociada <span class="required"> *</span></label>
    <div class="col-lg-6">
        <select data-plugin-selectTwo class="form-control populate" name="NU_incidencia" {% if edit_mode %} readonly {% endif %}
        data-plugin-options='{ "placeholder": "Seleccione una Incidencia", "allowClear": true }'>
            <option value=""></option>
            {% for incidence in incidences %}
            <option value="{{ incidence.NU_incidencia }}">
                {{ incidence.NU_incidencia }} - {{ incidence.AF_titulo }}
            </option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="form-group row">
    <label class="col-lg-3 control-label text-lg-right pt-2">Categoría <span class="required"> *</span></label>
    <div class="col-lg-6">
        <select data-plugin-selectTwo class="form-control populate" name="AF_codigo_categoria"
        data-plugin-options='{ "placeholder": "Seleccione una Categoría", "allowClear": true }'>
            <option value=""></option>
            {% for category in categories %}
            <option value="{{ category.AF_codigo }}">
                {{ category.authorative_name }}
            </option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="form-group row" >
    <label class="col-lg-3 control-label text-lg-right pt-2">Prioridad <span class="required"> *</span></label>
    <div class="col-lg-6">
        <select data-plugin-selectTwo class="form-control populate placeholder" name="AF_codigo_prioridad" 
        data-plugin-options='{ "placeholder": "Seleccione Prioridad", "allowClear": true }'>
            <option value=""></option>
            {% for priority in priorities %}
            <option value="{{ priority.AF_codigo }}"
            {% if edit_mode %}
                {% if priority.AF_codigo == ticket.AF_codigo_prioridad %} selected {% endif %}
            {% endif %}>
                {{ priority.AF_codigo }}
            </option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="form-group row" {% if not edit_mode %}style="border-bottom: 1px solid #eff2f7 !important; padding-bottom: 15px !important; margin-bottom: 15px !important;"{% endif %}>
    <label class="col-lg-3 control-label text-lg-right pt-2">Analista</label>
    <div class="col-lg-6">
        <select data-plugin-selectTwo class="form-control populate" name="AF_analista_asignado"
        data-plugin-options='{ "placeholder": "Asigne un Analista", "allowClear": true }'>
            <option value=""></option>
            {% for analist in analists %}
            <option value="{{ analist.AF_alias }}">
                {{ analist.AF_nombre }} {{ analist.AF_apellido }}
            </option>
            {% endfor %}
        </select>
    </div>
</div>

{% if edit_mode %}
<div class="form-group row">
    <label class="col-lg-3 control-label text-lg-right pt-2 col-lg-3">Archivar</label>
    <div class="col-lg-9">
        <div class="switch switch-sm switch-primary">
            <div class="ios-switch {% if ticket.BO_archivado %}on{% else %}off{% endif %}">
                <div class="on-background background-fill"></div>
                <div class="state-background background-fill"></div>
                <div class="handle"></div>
            </div>
            <input type="checkbox" name="BO_archivado" data-plugin-ios-switch="" {% if ticket.BO_archivado %}checked="checked"{% endif %} style="display: none;">
    </div>
</div>

<div class="form-group row" style="border-bottom: 1px solid #eff2f7 !important; padding-bottom: 15px !important; margin-bottom: 15px !important;">
    <label class="col-sm-3 control-label text-sm-right pt-2">Motivo Archivado</label>
    <div class="col-sm-7">
        <input type="text" name="AF_titulo" class="form-control" placeholder="Establecer motivo de archivado." required="" value="{{ ticket.AF_motivo_archivado }}">
    </div>
</div>
{% endif %}
