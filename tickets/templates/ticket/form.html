<div class="form-group row">
    <label class="col-sm-3 control-label text-sm-right pt-2">Título <span class="required"> *</span></label>
    <div class="col-sm-6">
        <input type="text" name="AF_titulo" class="form-control" placeholder="Título" required="" 
        {% if incoming_incidence %}value="{{ incoming_incidence.AF_titulo }}" {% endif %}>
    </div>
</div>

<div class="form-group row">
    <label class="col-lg-3 control-label text-lg-right pt-2">Descripción <span class="required"> *</span></label>
    <div class="col-lg-6">
        <textarea class="summernote" name="AF_descripcion" data-plugin-summernote
            data-plugin-options='{ "height": 180, "codemirror": { "theme": "ambiance" } }'>
            {% if incoming_incidence %}{{ incoming_incidence.AF_descripcion }}{% endif %}
        </textarea>
    </div>
</div>


<div class="form-group row">
    <label class="col-lg-3 control-label text-lg-right pt-2">Estatus</label>
    <div class="col-lg-6">
        <input type="text" name="AF_estatus" class="form-control" readonly value="Nuevo">
    </div>
</div>


<div class="form-group row">
    <label class="col-lg-3 control-label text-lg-right pt-2">Incidencia Asociada <span class="required"> *</span></label>

    {% if incoming_incidence %}
    <div class="col-sm-6">
        <input type="text" class="form-control" readonly 
        value="#{{ incoming_incidence.NU_incidencia }} - {{ incoming_incidence.AF_titulo }}">
        <input type="hidden" name="NU_incidencia" value="{{ incoming_incidence.NU_incidencia }}">
    </div>

    
    {% else %}
    <div class="col-lg-6">
        <select data-plugin-selectTwo class="form-control populate" name="NU_incidencia"
        data-plugin-options='{ "placeholder": "Seleccione una Incidencia", "allowClear": true }'>
            <option value=""></option>
            {% for incidence in incidences %}
            <option value="{{ incidence.NU_incidencia }}">
                {{ incidence.NU_incidencia }} - {{ incidence.AF_titulo }}
            </option>
            {% endfor %}
        </select>
    </div>

    {% endif %}
</div>

<div class="form-group row">
    <label class="col-lg-3 control-label text-lg-right pt-2">Categoría <span class="required"> *</span></label>
    <div class="col-lg-3">
        <select data-plugin-selectTwo class="form-control populate" name="AF_codigo_categoria"
        data-plugin-options='{ "placeholder": "Seleccione una Categoría", "allowClear": true }' required>
            <option value=""></option>
            {% for category in categories %}
            <option value="{{ category.AF_codigo }}">
                {{ category.authorative_name }}
            </option>
            {% endfor %}
        </select>
    </div>
    <label class="col-lg-1 control-label text-lg-right pt-2">Prioridad <span class="required"> *</span></label>
    <div class="col-lg-2">
        <select data-plugin-selectTwo class="form-control populate placeholder" name="AF_codigo_prioridad" 
        data-plugin-options='{ "placeholder": "Seleccione Prioridad", "allowClear": true }' required>
            <option value=""></option>
            {% for priority in priorities %}
            <option value="{{ priority.AF_codigo }}">
                {{ priority.AF_codigo }}
            </option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="form-group row" style="border-bottom: 1px solid #eff2f7 !important; padding-bottom: 15px !important; margin-bottom: 15px !important;">
    <label class="col-lg-3 control-label text-lg-right pt-2">Analista</label>
    <div class="col-lg-6">
        <select data-plugin-selectTwo class="form-control populate" name="AF_analista_asignado"
        data-plugin-options='{ "placeholder": "Asigne un Analista", "allowClear": true }'>
            <option value=""></option>
            {% for analist in analists %}
            <option value="{{ analist.AF_alias }}">
                {{ analist.AF_nombre }} {{ analist.AF_apellido }}
            </option>
            {% endfor %}
        </select>
    </div>
</div>

{% if edit_mode %}
<div class="form-group row">
    <label class="col-lg-3 control-label text-lg-right pt-2 col-lg-3">Archivar</label>
    <div class="col-lg-9">
        <div class="switch switch-sm switch-primary">
            <input type="checkbox" name="BO_archivado" data-plugin-ios-switch="" {% if obj.BO_archivado %}checked="checked"{% endif %} style="display: none;">
        </div>
    </div>
</div>


<div class="form-group row">
    <label class="col-sm-3 control-label text-sm-right pt-2">Motivo Archivado</label>
    <div class="col-sm-6">
        <input type="text" name="AF_motivo_archivado" class="form-control" placeholder="Establecer motivo de archivado."
        value="{{ obj.AF_motivo_archivado or '' }}">
    </div>
</div>

<div class="form-group row" style="border-bottom: 1px solid #eff2f7 !important; padding-bottom: 15px !important; margin-bottom: 15px !important;">
    <label class="col-lg-3 control-label text-lg-right pt-2">Fecha de Archivado</label>
    <div class="col-lg-6">
        <div class="input-group">
            <span class="input-group-prepend">
                <span class="input-group-text">
                    <i class="fas fa-calendar-alt"></i>
                </span>
            </span>
            <input data-plugin-masked-input data-input-mask="9999/99/99 99:99"
            class="form-control" value="{{ obj.TI_fecha_archivado }}" readonly>
        </div>
    </div>
</div>
{% endif %}
